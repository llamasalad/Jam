<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0f;
  --surface:#16161a;
  --surface2:#1e1e24;
  --surface3:#26262e;
  --border:rgba(255,255,255,0.06);
  --border2:rgba(255,255,255,0.12);
  --text:#f0f0f5;
  --muted:#7a7a8e;
  --accent:#c8a86b;
  --accent2:#e8c88b;
  --danger:#e05252;
  --radius:12px;
  --player-h:88px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overscroll-behavior:none}

/* ── Layout ── */
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#header{padding:16px 20px 12px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;gap:12px}
#header h1{font-size:18px;font-weight:500;letter-spacing:0.02em;flex:1}
#search-wrap{position:relative;display:flex;align-items:center}
#search{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:14px;padding:7px 12px 7px 32px;width:200px;outline:none;transition:border-color .2s,width .2s}
#search:focus{border-color:var(--border2);width:240px}
#search-icon{position:absolute;left:10px;color:var(--muted);pointer-events:none;font-size:14px}
#sort-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;font-family:'DM Mono',monospace;letter-spacing:0.03em;white-space:nowrap;transition:color .15s,border-color .15s}
#sort-btn:hover{color:var(--text);border-color:var(--border2)}

#main{flex:1;overflow-y:auto;padding-bottom:calc(var(--player-h) + 16px)}
#main::-webkit-scrollbar{width:4px}
#main::-webkit-scrollbar-track{background:transparent}
#main::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px}

/* ── States ── */
#loading,#empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;height:60vh;color:var(--muted);font-size:14px}
.spinner{width:28px;height:28px;border:2px solid var(--surface3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Group headings ── */
.group-header{padding:20px 20px 8px;font-size:11px;font-family:'DM Mono',monospace;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase;position:sticky;top:0;background:var(--bg);z-index:2;border-bottom:1px solid var(--border)}

/* ── Track row ── */
.track{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:10px 20px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s}
.track:hover{background:var(--surface)}
.track.active{background:var(--surface2)}
.track.active .track-title{color:var(--accent)}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;background:var(--surface3);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb-icon{font-size:18px;color:var(--muted)}
.thumb.playing{position:relative}
.thumb.playing::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.45);border-radius:8px}
.bars{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:2px;align-items:flex-end}
.bar{width:3px;background:var(--accent);border-radius:2px;animation:bar-bounce .6s ease-in-out infinite}
.bar:nth-child(2){animation-delay:.1s}
.bar:nth-child(3){animation-delay:.2s}
@keyframes bar-bounce{0%,100%{height:4px}50%{height:12px}}
.track-info{min-width:0}
.track-title{font-size:14px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.track-dur{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);flex-shrink:0}
 
/* ── Now playing bar ── */
#player{position:fixed;bottom:0;left:0;right:0;height:var(--player-h);background:var(--surface);border-top:1px solid var(--border2);display:flex;flex-direction:column;justify-content:center;padding:0 20px;gap:6px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:10}
#player.hidden{display:none}
#player-top{display:flex;align-items:center;gap:12px}
#player-thumb{width:40px;height:40px;border-radius:8px;background:var(--surface3);object-fit:cover;flex-shrink:0}
#player-info{flex:1;min-width:0}
#player-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent)}
#player-artist{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#controls{display:flex;align-items:center;gap:8px}
.ctrl-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:color .15s,background .15s}
.ctrl-btn:hover{color:var(--text);background:var(--surface3)}
.ctrl-btn.main{background:var(--accent);color:#000;border-radius:50%;width:36px;height:36px}
.ctrl-btn.main:hover{background:var(--accent2)}
svg{display:block}
#progress-row{display:flex;align-items:center;gap:8px}
#progress{flex:1;height:3px;-webkit-appearance:none;appearance:none;border-radius:2px;background:var(--surface3);outline:none;cursor:pointer}
#progress::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);cursor:pointer}
#progress::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:none;cursor:pointer}
.time-label{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);min-width:32px}
.time-label:last-child{text-align:right}

/* ── Token auth overlay ── */
#auth-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
#auth-box{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);padding:32px 28px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:16px}
#auth-box h2{font-size:18px;font-weight:500}
#auth-box p{font-size:13px;color:var(--muted);line-height:1.6}
#auth-input{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Mono',monospace;font-size:14px;padding:10px 12px;outline:none;transition:border-color .2s}
#auth-input:focus{border-color:var(--accent)}
#auth-submit{background:var(--accent);color:#000;border:none;border-radius:8px;padding:10px 16px;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
#auth-submit:hover{background:var(--accent2)}
#auth-error{font-size:12px;color:var(--danger);display:none}

@media(max-width:400px){
  #search{width:140px}
  #search:focus{width:160px}
}
</style>
</head>
<body>

<div id="auth-overlay" style="display:none">
  <div id="auth-box">
    <h2>Access required</h2>
    <p>Enter your auth token to access this music server.</p>
    <input id="auth-input" type="password" placeholder="Token" autocomplete="current-password"/>
    <p id="auth-error">Incorrect token — try again.</p>
    <button id="auth-submit">Continue</button>
  </div>
</div>

<div id="app">
  <div id="header">
    <h1>Music</h1>
    <div id="search-wrap">
      <span id="search-icon">⌕</span>
      <input id="search" type="search" placeholder="Search…" autocomplete="off"/>
    </div>
    <button id="sort-btn">A→Z</button>
  </div>

  <div id="main">
    <div id="loading"><div class="spinner"></div><span>Loading library…</span></div>
    <div id="empty" style="display:none">No tracks found — check your MUSIC_DIR setting.</div>
    <div id="track-list"></div>
  </div>

  <div id="player" class="hidden">
    <div id="player-top">
      <img id="player-thumb" src="" alt=""/>
      <div id="player-info">
        <div id="player-title">—</div>
        <div id="player-artist">—</div>
      </div>
      <div id="controls">
        <button class="ctrl-btn" id="btn-prev" title="Previous">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
        </button>
        <button class="ctrl-btn main" id="btn-play" title="Play/Pause">
          <svg id="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-next" title="Next">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2.5-6 5.5 3.9V8.1L8.5 12zM16 6h2v12h-2z"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-shuffle" title="Shuffle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
      </div>
    </div>
    <div id="progress-row">
      <span class="time-label" id="time-cur">0:00</span>
      <input id="progress" type="range" min="0" max="100" value="0" step="0.1"/>
      <span class="time-label" id="time-tot">0:00</span>
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script>
const TOKEN_KEY = 'music_token';
let token = localStorage.getItem(TOKEN_KEY) || '';
let tracks = [], filtered = [], queue = [], qIdx = -1, sortMode = 'title';
let shuffle = false, seeking = false;

const audio = document.getElementById('audio');
const player = document.getElementById('player');
const trackList = document.getElementById('track-list');
const loading = document.getElementById('loading');
const empty = document.getElementById('empty');
const searchEl = document.getElementById('search');
const sortBtn = document.getElementById('sort-btn');
const btnPlay = document.getElementById('btn-play');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const btnShuffle = document.getElementById('btn-shuffle');
const iconPlay = document.getElementById('icon-play');
const iconPause = document.getElementById('icon-pause');
const progress = document.getElementById('progress');
const timeCur = document.getElementById('time-cur');
const timeTot = document.getElementById('time-tot');
const authOverlay = document.getElementById('auth-overlay');
const authInput = document.getElementById('auth-input');
const authSubmit = document.getElementById('auth-submit');
const authError = document.getElementById('auth-error');

function fmt(s){if(!s||isNaN(s))return'0:00';s=Math.round(s);return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}

function headers(){return token?{'x-auth-token':token}:{}}

async function checkAuth(){
  const r=await fetch('/api/status',{headers:headers()});
  if(r.status===401){showAuthOverlay();return false}
  return true
}

function showAuthOverlay(){authOverlay.style.display='flex'}
function hideAuthOverlay(){authOverlay.style.display='none'}

authSubmit.onclick=async()=>{
  token=authInput.value.trim();
  authError.style.display='none';
  const ok=await checkAuth();
  if(ok){localStorage.setItem(TOKEN_KEY,token);hideAuthOverlay();loadTracks()}
  else{authError.style.display='block'}
};
authInput.addEventListener('keydown',e=>{if(e.key==='Enter')authSubmit.click()});

async function loadTracks(){
  loading.style.display='flex';empty.style.display='none';trackList.innerHTML='';
  try{
    const r=await fetch('/api/tracks',{headers:headers()});
    if(r.status===401){showAuthOverlay();return}
    tracks=await r.json();
    if(!tracks.length){loading.style.display='none';empty.style.display='flex';return}
    applyFilter();
  }catch(e){loading.style.display='none';empty.style.display='flex';empty.querySelector('span')&&(empty.textContent='Could not connect to server.')}
}

function applyFilter(){
  const q=searchEl.value.toLowerCase();
  filtered=q?tracks.filter(t=>
    (t.title||'').toLowerCase().includes(q)||
    (t.artist||'').toLowerCase().includes(q)||
    (t.album||'').toLowerCase().includes(q)
  ):[...tracks];
  sort();
}

const sortModes=['title','artist','album'];
const sortLabels=['A→Z','ARTIST','ALBUM'];
let sortModeIdx=0;
sortBtn.onclick=()=>{sortModeIdx=(sortModeIdx+1)%3;sortMode=sortModes[sortModeIdx];sortBtn.textContent=sortLabels[sortModeIdx];sort()};

function sort(){
  filtered.sort((a,b)=>{
    const ka=(a[sortMode]||'').toLowerCase();
    const kb=(b[sortMode]||'').toLowerCase();
    return ka<kb?-1:ka>kb?1:0;
  });
  renderList();
}

function groupKey(t){
  if(sortMode==='title')return(t.title||'?')[0].toUpperCase();
  if(sortMode==='artist')return t.artist||'Unknown';
  return t.album||'Unknown';
}

function renderList(){
  loading.style.display='none';
  trackList.innerHTML='';
  if(!filtered.length){empty.style.display='flex';return}
  empty.style.display='none';
  let lastGroup='';
  const frag=document.createDocumentFragment();
  for(const t of filtered){
    const g=groupKey(t);
    if(g!==lastGroup){
      lastGroup=g;
      const h=document.createElement('div');
      h.className='group-header';h.textContent=g;frag.appendChild(h);
    }
    frag.appendChild(makeRow(t));
  }
  trackList.appendChild(frag);
}

function makeRow(t){
  const div=document.createElement('div');
  div.className='track';div.dataset.id=t.id;
  if(qIdx>=0&&queue[qIdx]?.id===t.id)div.classList.add('active');
  const thumb=document.createElement('div');thumb.className='thumb';
  if(t.cover){const img=new Image();img.src=t.cover;img.alt='';thumb.appendChild(img)}
  else{const sp=document.createElement('span');sp.className='thumb-icon';sp.textContent='♪';thumb.appendChild(sp)}
  const info=document.createElement('div');info.className='track-info';
  const ti=document.createElement('div');ti.className='track-title';ti.textContent=t.title||'Unknown';
  const ts=document.createElement('div');ts.className='track-sub';ts.textContent=[t.artist,t.album].filter(Boolean).join(' · ')||'—';
  info.append(ti,ts);
  const dur=document.createElement('div');dur.className='track-dur';dur.textContent=fmt(t.duration);
  div.append(thumb,info,dur);
  div.onclick=()=>playTrack(t,filtered);
  return div;
}

function playTrack(t,list){
  queue=[...list];qIdx=queue.findIndex(x=>x.id===t.id);
  play(t);
  document.querySelectorAll('.track.active').forEach(e=>e.classList.remove('active'));
  const row=document.querySelector(`.track[data-id="${t.id}"]`);
  if(row)row.classList.add('active');
}

const FALLBACK_THUMB='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="%2326262e"/><text x="50%25" y="54%25" text-anchor="middle" fill="%237a7a8e" font-size="18">♪</text></svg>';

function play(t){
  const tokenSuffix=token?`?token=${encodeURIComponent(token)}`:'';
  audio.src=`/api/stream/${t.id}${tokenSuffix}`;
  audio.play();
  player.classList.remove('hidden');
  document.getElementById('player-title').textContent=t.title||'Unknown';
  document.getElementById('player-artist').textContent=[t.artist,t.album].filter(Boolean).join(' · ')||'—';
  const playerThumb=document.getElementById('player-thumb');
  playerThumb.src=t.cover||FALLBACK_THUMB;
  document.title=`${t.title||'?'} · Music`;
}

audio.addEventListener('timeupdate',()=>{
  if(seeking)return;
  if(audio.duration){progress.value=(audio.currentTime/audio.duration)*100;timeCur.textContent=fmt(audio.currentTime);timeTot.textContent=fmt(audio.duration)}
});
audio.addEventListener('play',()=>{iconPlay.style.display='none';iconPause.style.display='block'});
audio.addEventListener('pause',()=>{iconPlay.style.display='block';iconPause.style.display='none'});
audio.addEventListener('ended',()=>nextTrack());

progress.addEventListener('mousedown',()=>seeking=true);
progress.addEventListener('touchstart',()=>seeking=true,{passive:true});
progress.addEventListener('input',()=>{if(audio.duration)timeCur.textContent=fmt(audio.duration*progress.value/100)});
progress.addEventListener('change',()=>{if(audio.duration){audio.currentTime=audio.duration*progress.value/100}seeking=false});

btnPlay.onclick=()=>audio.paused?audio.play():audio.pause();
btnPrev.onclick=()=>{if(audio.currentTime>3){audio.currentTime=0}else prevTrack()};
btnNext.onclick=()=>nextTrack();
btnShuffle.onclick=()=>{shuffle=!shuffle;btnShuffle.style.color=shuffle?'var(--accent)':'var(--muted)'};

function nextTrack(){
  if(!queue.length)return;
  if(shuffle){qIdx=Math.floor(Math.random()*queue.length)}else{qIdx=(qIdx+1)%queue.length}
  play(queue[qIdx]);updateActive();
}
function prevTrack(){
  if(!queue.length)return;
  qIdx=(qIdx-1+queue.length)%queue.length;play(queue[qIdx]);updateActive();
}
function updateActive(){
  document.querySelectorAll('.track.active').forEach(e=>e.classList.remove('active'));
  if(qIdx>=0){const row=document.querySelector(`.track[data-id="${queue[qIdx]?.id}"]`);if(row)row.classList.add('active')}
}

searchEl.addEventListener('input',applyFilter);

// Keyboard shortcuts
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;
  if(e.key===' '){e.preventDefault();audio.paused?audio.play():audio.pause()}
  if(e.key==='ArrowRight')nextTrack();
  if(e.key==='ArrowLeft')prevTrack();
});

// Init
(async()=>{
  const ok=await checkAuth();
  if(ok)loadTracks();
})();
</script>
</body>
</html>
